version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: dp-vc-webapp-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dp-vc-webApp
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - dp-vc-webapp-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.stats().ok' | mongosh --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: dp-vc-webapp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dp-vc-webapp-network
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  dp-vc-webapp-network:
    driver: bridge
